<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ABG Clinical Decision Support</title>
<style>
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#0E1C26; --muted:#5A6B75;
  --line:#D5DCE1; --line-soft:#E7ECEF;
  --primary:#0C6B74; --primary-tint:#E3F0F1; --primary-ink:#08484E;
  --green:#2E9E6B; --amber:#D69A21; --orange:#DC6B2F; --red:#C33A3A;
  --shadow:0 1px 2px rgba(14,28,38,.06),0 8px 24px rgba(14,28,38,.05);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.45}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.topbar{background:var(--ink);color:#fff;padding:14px 20px}
.topbar-wrap{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand b{font-size:16px;font-weight:700}
.brand .ver{font-size:11px;color:#8fa3ad;letter-spacing:.06em;margin-left:8px}
.safety-strip{margin-left:auto;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:6px 12px;border-radius:999px;font-size:12px;color:#dbe6e9}
.safety-dot{width:7px;height:7px;border-radius:50%;background:var(--amber)}
.layout{max-width:1180px;margin:0 auto;padding:22px 20px 60px;display:grid;grid-template-columns:380px 1fr;gap:22px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.panel-h{padding:14px 18px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between}
.panel-h h2{margin:0;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--primary-ink);font-weight:700}
.panel-b{padding:18px}
.field{margin-bottom:14px}
.field>label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
input,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-family:var(--mono);font-size:14px;color:var(--ink);background:#fff;outline:none}
input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-tint)}
select{font-family:var(--sans)}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{flex:1;padding:9px;border:none;background:#fff;font-family:inherit;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--primary);color:#fff}
.subhead{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:18px 0 10px;padding-top:14px;border-top:1px dashed var(--line)}
.actions{display:flex;gap:10px;margin-top:8px}
.btn{flex:1;padding:12px;border-radius:10px;border:1px solid transparent;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-ink)}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--primary-ink)}
.btn-ghost:hover{background:var(--primary-tint)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.report-head{display:grid;grid-template-columns:1fr auto;gap:18px}
@media (max-width:560px){.report-head{grid-template-columns:1fr}}
.dx-label{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px}
.dx-main{font-size:22px;font-weight:700;line-height:1.2}
.dx-sub{margin-top:6px;font-size:13px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{font-size:11px;font-weight:600;padding:4px 9px;border-radius:6px;background:var(--primary-tint);color:var(--primary-ink)}
.tag.warn{background:#fbe6d0;color:#8a5a12}
.spine{width:150px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.spine-top{padding:12px 12px 8px;text-align:center}
.spine-score{font-size:34px;font-weight:700;line-height:1}
.spine-score small{font-size:15px;color:var(--muted);font-weight:600}
.spine-label{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.spine-bars{display:flex;flex-direction:column-reverse;gap:2px;padding:8px}
.spine-seg{height:9px;border-radius:2px;background:var(--line-soft)}
.spine-prio{padding:9px;text-align:center;font-size:11px;font-weight:800;letter-spacing:.05em;color:#fff}
.rows{margin-top:16px;border-top:1px solid var(--line-soft)}
.row{display:grid;grid-template-columns:150px 1fr;gap:14px;padding:11px 0;border-bottom:1px solid var(--line-soft)}
@media (max-width:560px){.row{grid-template-columns:1fr;gap:3px}}
.row .k{font-size:12px;font-weight:600;color:var(--muted)}
.row .v{font-size:14px}
.card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:14px;background:#fbfcfd}
.card h3{margin:0 0 10px;font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--primary-ink);font-weight:700}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:13px;border-bottom:1px dashed var(--line-soft)}
.kv:last-child{border-bottom:none}
.kv .kk{color:var(--muted)}
.list{margin:0;padding-left:0;list-style:none}
.list li{position:relative;padding:6px 0 6px 20px;font-size:13px;border-bottom:1px dashed var(--line-soft)}
.list li:last-child{border-bottom:none}
.list li::before{content:"";position:absolute;left:4px;top:12px;width:6px;height:6px;border-radius:50%;background:var(--primary)}
.list.action li::before{background:var(--orange);border-radius:2px}
.safety{margin-top:16px;background:#fff7ea;border:1px solid #f0d8a8;border-radius:12px;padding:14px 16px}
.safety .st{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8a5a12;font-weight:700;margin-bottom:6px}
.safety p{margin:4px 0;font-size:12.5px;color:#6b4e13}
.safety .ar{direction:rtl;text-align:right;font-size:13px}
.errbox{background:#fdecec;border:1px solid #f0b8b8;border-radius:12px;padding:16px}
.errbox .et{font-weight:700;color:var(--red);margin-bottom:4px}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty h3{margin:0 0 6px;color:var(--ink);font-size:15px}
.empty p{margin:0;font-size:13px}
.sample-note{font-size:11px;color:#8a5a12;background:#fbe6d0;border:1px solid #f0d8a8;padding:6px 10px;border-radius:7px;margin-bottom:14px;font-weight:600}
.hidden{display:none}
</style>
</head>
<body>
<div class="topbar"><div class="topbar-wrap">
  <div class="brand"><b>ABG &middot; Clinical Decision Support</b><span class="ver mono">v1.0.0</span></div>
  <div class="safety-strip"><span class="safety-dot"></span>Support tool &mdash; does not replace clinical judgment</div>
</div></div>

<div class="layout">
  <div class="panel">
    <div class="panel-h"><h2>Blood gas input</h2></div>
    <div class="panel-b">
      <div class="grid2">
        <div class="field"><label>Sample</label>
          <select id="sample_type"><option>ABG</option><option>VBG</option><option>CBG</option></select></div>
        <div class="field"><label>Context</label>
          <select id="clinical_context"><option>General</option><option>ARDS</option><option>COPD</option></select></div>
      </div>
      <div class="grid3">
        <div class="field"><label>pH</label><input id="ph" placeholder="7.40" inputmode="decimal"></div>
        <div class="field"><label>PaCO&#8322;</label><input id="pco2" placeholder="40" inputmode="decimal"></div>
        <div class="field"><label>HCO&#8323;</label><input id="hco3" placeholder="24" inputmode="decimal"></div>
      </div>
      <div class="grid3">
        <div class="field"><label>PaO&#8322;</label><input id="po2" placeholder="90" inputmode="decimal"></div>
        <div class="field"><label>Na&#8314;</label><input id="na" placeholder="140" inputmode="decimal"></div>
        <div class="field"><label>Cl&#8315;</label><input id="cl" placeholder="104" inputmode="decimal"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Albumin (opt)</label><input id="albumin" placeholder="&mdash;" inputmode="decimal"></div>
        <div class="field"><label>Resp. chronicity</label>
          <select id="resp_chronicity"><option value="unknown">unknown</option><option value="acute">acute</option><option value="chronic">chronic</option></select></div>
      </div>

      <div class="subhead">Mechanical ventilation</div>
      <div class="seg">
        <button id="vent_no" class="on" onclick="setVent('no')">Not ventilated</button>
        <button id="vent_yes" onclick="setVent('yes')">On ventilator</button>
      </div>

      <div id="vent_fields" class="hidden" style="margin-top:14px">
        <div class="grid2">
          <div class="field"><label>Mode</label><input id="mode" placeholder="PC-AC" style="font-family:var(--sans)"></div>
          <div class="field"><label>FiO&#8322; (%)</label><input id="fio2" placeholder="50" inputmode="decimal"></div>
        </div>
        <div class="grid3">
          <div class="field"><label>RR</label><input id="rr" placeholder="18" inputmode="decimal"></div>
          <div class="field"><label>TV (mL)</label><input id="tv" placeholder="420" inputmode="decimal"></div>
          <div class="field"><label>PEEP</label><input id="peep" placeholder="8" inputmode="decimal"></div>
        </div>
        <div class="grid2">
          <div class="field"><label>Height (cm)</label><input id="height_cm" placeholder="170" inputmode="decimal"></div>
          <div class="field"><label>Sex (for IBW)</label>
            <select id="sex"><option value="male">male</option><option value="female">female</option></select></div>
        </div>
      </div>

      <div class="actions">
        <button id="btnGo" class="btn btn-primary" onclick="interpret()">Interpret</button>
        <button class="btn btn-ghost" onclick="loadSample()">Load sample</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-h"><h2>Interpretation</h2><span id="ctx" class="eyebrow"></span></div>
    <div class="panel-b" id="report">
      <div class="empty"><h3>Enter values, then Interpret</h3><p>Or tap &ldquo;Load sample&rdquo; to preview a full report.</p></div>
    </div>
  </div>
</div>

<script>
var onVent = "no";
function setVent(v){
  onVent = v;
  document.getElementById("vent_no").className = v==="no"?"on":"";
  document.getElementById("vent_yes").className = v==="yes"?"on":"";
  document.getElementById("vent_fields").className = v==="yes"?"":"hidden";
}
function val(id){ var e=document.getElementById(id); return e?e.value:""; }
function num(x){ return x===""||x==null ? null : parseFloat(x); }
function N(v){ return (v===null||v===undefined||v==="") ? "\u2014" : v; }
var PRIO_COLOR = {"IMMEDIATE ICU ACTION":"var(--red)","URGENT REVIEW":"var(--orange)","MODERATE":"var(--amber)","STABLE":"var(--green)"};
function scoreColor(s){ if(s>=9)return"var(--red)"; if(s>=7)return"var(--orange)"; if(s>=4)return"var(--amber)"; return"var(--green)"; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

var SAMPLE = {
  valid:true, warnings:["FiO2 interpreted on a 0\u2013100 scale."],
  acid_base_status:"Acidemia", primary_disorder:"Respiratory Acidosis", secondary_disorder:"",
  final_interpretation:"Acute Respiratory Acidosis",
  compensation:"Expected HCO3: acute ~26.4, chronic ~31.2",
  compensation_status:"Consistent with an ACUTE process (minimal renal compensation)",
  anion_gap:12.0, anion_gap_corrected:null, anion_gap_interpretation:"Normal anion gap (12.0)",
  delta_ratio:null, delta_ratio_interpretation:"",
  oxygenation_status:"Severe oxygenation impairment", oxygenation_note:"", pf_ratio:88.0,
  ventilator_status:"On mechanical ventilation",
  ibw_kg:66.7, tv_per_kg:5.7, lung_protective:"Lung-protective (5.7 mL/kg IBW)",
  rsbi:57.9, rsbi_interpretation:"RSBI 57.9 <= 105: weaning may be favourable (clinical correlation required)",
  context_interpretation:"Severe ARDS (P/F < 100)",
  context_notes:["P/F-based staging only. Full Berlin criteria also require acute onset, bilateral infiltrates on imaging, and exclusion of a purely cardiogenic cause \u2014 confirm clinically.","Critical hypoxemia \u2014 urgent escalation required"],
  ventilator_suggestions:["Apply lung-protective ventilation (target 4\u20136 mL/kg IBW)","Increase PEEP and optimize FiO2 before increasing minute ventilation","Consider prone positioning (P/F < 100)"],
  risk_flag:"Critical \u2014 life-threatening hypoxemia",
  attention_index:10, attention_index_label:"Rule-based Clinical Attention Index (heuristic, non-prognostic)",
  priority_level:"IMMEDIATE ICU ACTION",
  clinical_flags:["ARDS","Critical Hypoxemia","Ventilated Patient"],
  clinical_considerations:["Increase PEEP (stepwise, titrated strategy)","Optimize FiO2 to target SpO2 88\u201395%","Apply lung-protective ventilation (4\u20136 mL/kg IBW)","Consider prone positioning","Evaluate for ECMO referral if refractory hypoxemia"],
  safety_note:"Support tool for a qualified clinician. It does not replace clinical judgment.",
  safety_note_ar:"\u0623\u062f\u0627\u0629 \u0645\u0633\u0627\u0646\u062f\u0629 \u0644\u0644\u0623\u062e\u0635\u0627\u0626\u064a \u0627\u0644\u0645\u0624\u0647\u0644\u060c \u0648\u0644\u0627 \u062a\u064f\u063a\u0646\u064a \u0639\u0646 \u0627\u0644\u062d\u0643\u0645 \u0627\u0644\u0633\u0631\u064a\u0631\u064a."
};

function interpret(){
  var payload = {
    sample_type:val("sample_type"), clinical_context:val("clinical_context"),
    ph:num(val("ph")), pco2:num(val("pco2")), hco3:num(val("hco3")), po2:num(val("po2")),
    na:num(val("na")), cl:num(val("cl")), on_vent:onVent, mode:val("mode"),
    rr:num(val("rr")), tv:num(val("tv")), peep:num(val("peep")), fio2:num(val("fio2")),
    albumin:num(val("albumin")), height_cm:num(val("height_cm")), sex:val("sex")||"male",
    resp_chronicity:val("resp_chronicity")
  };
  var btn=document.getElementById("btnGo"); btn.disabled=true; btn.textContent="Interpreting\u2026";
  fetch("/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)})
    .then(function(r){ if(!r.ok) throw new Error("API "+r.status); return r.json(); })
    .then(function(data){ render(data,false); })
    .catch(function(e){
      document.getElementById("report").innerHTML =
        '<div class="errbox"><div class="et">Cannot reach engine</div><div style="font-size:13px;color:var(--muted)">'+esc(e.message)+'. Make sure the server is running, or tap Load sample.</div></div>';
    })
    .then(function(){ btn.disabled=false; btn.textContent="Interpret"; });
}
function loadSample(){ render(SAMPLE,true); }

function render(r,isSample){
  var ctx=document.getElementById("ctx");
  var out=document.getElementById("report");
  if(!r.valid){
    ctx.textContent="";
    out.innerHTML='<div class="errbox"><div class="et">Validation stopped interpretation</div><div style="font-size:13px">'+esc(r.error||"")+'</div></div>'+safetyBlock(r);
    return;
  }
  ctx.textContent=(val("sample_type")||"ABG")+" \u00b7 "+(isSample?"SAMPLE":(val("clinical_context")||""));
  var h="";
  if(isSample) h+='<div class="sample-note">Illustrative sample \u2014 not a computed result.</div>';
  var sc=scoreColor(r.attention_index);
  var bars="";
  for(var i=0;i<10;i++){ bars+='<div class="spine-seg" style="background:'+(i<r.attention_index?scoreColor(i+1):"var(--line-soft)")+'"></div>'; }
  var tags="";
  (r.clinical_flags||[]).forEach(function(t){ tags+='<span class="tag">'+esc(t)+'</span>'; });
  (r.warnings||[]).forEach(function(t){ tags+='<span class="tag warn">\u26a0 '+esc(t)+'</span>'; });

  h+='<div class="report-head"><div>'+
     '<div class="dx-label">Final interpretation</div>'+
     '<div class="dx-main">'+esc(N(r.final_interpretation||r.primary_disorder))+'</div>'+
     '<div class="dx-sub">'+esc(N(r.acid_base_status))+(r.secondary_disorder?' \u00b7 +'+esc(r.secondary_disorder):'')+'</div>'+
     '<div class="tags">'+tags+'</div></div>'+
     '<div class="spine"><div class="spine-top"><div class="spine-score mono" style="color:'+sc+'">'+r.attention_index+'<small>/10</small></div>'+
     '<div class="spine-label">Attention index</div></div>'+
     '<div class="spine-bars">'+bars+'</div>'+
     '<div class="spine-prio" style="background:'+(PRIO_COLOR[r.priority_level]||"var(--muted)")+'">'+esc(r.priority_level)+'</div></div></div>';

  h+='<div class="rows">';
  h+=rowHTML("Primary disorder",esc(N(r.primary_disorder)));
  if(r.compensation) h+=rowHTML("Compensation",'<span class="mono">'+esc(r.compensation)+'</span><br>'+esc(r.compensation_status||""));
  h+=rowHTML("Risk flag",esc(N(r.risk_flag)));
  h+='</div>';

  h+='<div class="card"><h3>Anion gap</h3>'+kv("Anion gap",'<span class="mono">'+esc(N(r.anion_gap))+'</span>');
  if(r.anion_gap_corrected!=null) h+=kv("Albumin-corrected",'<span class="mono">'+esc(r.anion_gap_corrected)+'</span>');
  h+=kv("Interpretation",esc(N(r.anion_gap_interpretation)));
  if(r.delta_ratio!=null) h+=kv("Delta ratio",'<span class="mono">'+esc(r.delta_ratio)+'</span>');
  h+='</div>';

  h+='<div class="card"><h3>Oxygenation &amp; ventilation</h3>'+kv("Status",esc(N(r.oxygenation_status||r.oxygenation_note)));
  if(r.pf_ratio!=null) h+=kv("P/F ratio",'<span class="mono">'+esc(r.pf_ratio)+'</span>');
  h+=kv("Ventilation",esc(N(r.ventilator_status)));
  if(r.ibw_kg!=null) h+=kv("IBW (Devine)",'<span class="mono">'+esc(r.ibw_kg)+' kg</span>');
  if(r.tv_per_kg!=null) h+=kv("TV per kg IBW",'<span class="mono">'+esc(r.tv_per_kg)+' mL/kg</span>');
  if(r.lung_protective) h+=kv("Lung-protective",esc(r.lung_protective));
  if(r.rsbi!=null) h+=kv("RSBI",'<span class="mono">'+esc(r.rsbi)+'</span>');
  h+='</div>';

  if(r.context_interpretation || (r.context_notes||[]).length){
    h+='<div class="card"><h3>Clinical context</h3>';
    if(r.context_interpretation) h+=kv("Assessment",'<b>'+esc(r.context_interpretation)+'</b>');
    if((r.context_notes||[]).length){ h+='<ul class="list" style="margin-top:8px">'; r.context_notes.forEach(function(n){h+='<li>'+esc(n)+'</li>';}); h+='</ul>'; }
    h+='</div>';
  }
  if((r.ventilator_suggestions||[]).length){
    h+='<div class="card"><h3>Ventilator suggestions</h3><ul class="list">';
    r.ventilator_suggestions.forEach(function(s){h+='<li>'+esc(s)+'</li>';}); h+='</ul></div>';
  }
  if((r.clinical_considerations||[]).length){
    h+='<div class="card"><h3>Clinical considerations \u00b7 '+esc(r.priority_level)+'</h3><ul class="list action">';
    r.clinical_considerations.forEach(function(a){h+='<li>'+esc(a)+'</li>';}); h+='</ul></div>';
  }
  if(r.attention_index_label) h+='<div style="margin-top:12px;font-size:11px;color:var(--muted)">'+esc(r.attention_index_label)+'</div>';
  h+=safetyBlock(r);
  out.innerHTML=h;
}
function rowHTML(k,v){ return '<div class="row"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>'; }
function kv(k,v){ return '<div class="kv"><span class="kk">'+k+'</span><span style="text-align:right">'+v+'</span></div>'; }
function safetyBlock(r){
  if(!r.safety_note && !r.safety_note_ar) return "";
  var s='<div class="safety"><div class="st">Clinical safety</div>';
  if(r.safety_note) s+='<p>'+esc(r.safety_note)+'</p>';
  if(r.safety_note_ar) s+='<p class="ar">'+esc(r.safety_note_ar)+'</p>';
  return s+'</div>';
}
</script>
</body>
</html>
